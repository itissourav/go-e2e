services:
  app:
    image: ${IMAGE}

    container_name: go-e2e-app

    ports:
      - "8080:8080"

    environment:
      APP_ENV: prod
      AWS_REGION: ap-south-1

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:8080/v1/health"]
      interval: 300s
      timeout: 5s
      retries: 3

    networks:
      - backend

networks:
  backend: