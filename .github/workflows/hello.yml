name: Build, Push and Deploy

on:
  push:
    branches:
      - main

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
  ECR_REPOSITORY: go-e2e
  IMAGE_TAG: ${{ github.sha }}

jobs:
  docker-build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout source code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Configure AWS Credentials
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Verify AWS Identity
      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      # Verify ECR Repository
      - name: Verify ECR Repository
        run: aws ecr describe-repositories

      # Login Docker to ECR
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # Verify Docker
      - name: Verify Docker
        run: |
          docker --version
          docker info

      # Build Docker Image
      - name: Build Docker Image
        run: |
          ECR_REGISTRY=${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com

          docker build \
            -t ${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG} \
            -t ${ECR_REGISTRY}/${ECR_REPOSITORY}:latest \
            .

      # Show Docker Images
      - name: List Docker Images
        run: docker images

      # Inspect Image
      - name: Inspect Docker Image
        run: |
          ECR_REGISTRY=${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com
          docker image inspect ${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}

      # Push Images
      - name: Push Images to Amazon ECR
        run: |
          ECR_REGISTRY=${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com

          docker push ${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}
          docker push ${ECR_REGISTRY}/${ECR_REPOSITORY}:latest

      # Configure SSH
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      # Deploy to EC2
      - name: Deploy Application
        run: |
          ssh -o StrictHostKeyChecking=yes \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'

            set -e

            cd ~/go-e2e

            echo "===== Current Directory ====="
            pwd

            echo "===== Pull Latest Code ====="
            git pull origin main

            echo "===== Pull Latest Docker Image ====="
            docker compose -f docker-compose.prod.yml pull

            echo "===== Restart Containers ====="
            docker compose -f docker-compose.prod.yml up -d

            echo "===== Running Containers ====="
            docker ps

            echo "===== Docker Compose Status ====="
            docker compose -f docker-compose.prod.yml ps

          EOF

      # Wait for application startup
      - name: Wait for Application
        run: sleep 15

      # Health Check
      - name: Health Check
        run: |
          curl --fail --show-error --silent https://go-e2e-my.abrdns.com/v1/health

      # Deployment Success
      - name: Deployment Successful
        run: echo "Application deployed successfully!"